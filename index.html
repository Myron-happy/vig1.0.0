		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box
				
			}
			body{
				background:#464646 ;
			}
			.box2 {
			    background: transparent; 
			    box-shadow: none; 
			}
			
			.logo {
			    color: #ffffffc3;
			    background: #009dff;
			    text-align: center;
			    margin: 5px 20px 0 20px; 
			    padding: 10px 0; 
			    border-radius: 8px; 
			    box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
			}
			.img{
				display: block; margin: 0 auto;
				margin-top: 10px;
				border-radius: 6px;
				width: 250px; 
				height: auto; 
				box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
			}
			.marquee-container {
			    width: 100%;
			    overflow: hidden;
			    margin-top: 15px;
			    position: relative;
			}
			
			.marquee-text {
			    display: inline-block;
			    white-space: nowrap;
			    color: skyblue;
			    font-size: 18px;
			    font-weight: bold;
			    background-color: #ffffff96;
			    padding: 8px 15px; 
			    border-radius: 20px; 
			    box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
			    transform: translateX(100vw); 
			    animation: scroll-left 10s linear infinite;
			}
			
			@keyframes scroll-left {
			    0% {
			        transform: translateX(100vw);
			    }
			    100% {
			        transform: translateX(-100%); 
			    }
			}
			
			
			.nav-links a.active {
			    background-color: skyblue;
			    color: #333;
			    box-shadow: none;
			}
			.custom-line {
			    width: 100%;          
			    height: 2px;         
			    background-color: skyblue; 
			    margin: 10px 0 0 0;
			    border-radius: 0;
				box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
			}
			#clock {
			    color: #ffffff;
			    font-family: monospace;
			}
			.img {
			    display: block; 
			    margin: 0 auto;
			    margin-top: 10px;
			    border-radius: 6px;
			    width: 250px; 
			    height: auto; 
			    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6); 
			    
			 
			    transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.6s ease-out;
			    
			
			    cursor: pointer; 
			}
			
		
			.img:hover {
			  
			    transform: scale(1.05); 
			    
			 
			    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8); 
			    
			  
			    position: relative; 
			    z-index: 10; 
			}
			.nav-links {
			    display: flex;             
			    justify-content: center;   
			    align-items: center;      
			    gap: 25px;                 
			    margin-top: 30px;          
			    margin-bottom: 30px;
				
					   
			}
			
			
			.divider {
			    width: 2px;               
			    height: 35px;             
			    background-color: rgba(255, 255, 255, 0.3); 
			    border-radius: 2px;       
			}
			.nav-links a {
			    color: #ffffff;          
			    text-decoration: none;    
			    font-size: 20px;          
			    font-weight: bold;      
			    padding: 12px 30px;      
			    border-radius: 30px;     
			    background-color: rgba(255, 255, 255, 0.1); 
				box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
			    transition: all 0.3s ease;
			    cursor: pointer;
			}
			
			.nav-links a:hover {
			    color: #ffffff;           A
			    background-color: skyblue; 
			    box-shadow: none; 
			    transform: translateY(-3px); 
			}
			@media (max-width: 620px) {
			    .nav-links { flex-wrap: wrap; gap: 8px; padding-inline: 10px; }
			    .nav-links a { padding: 10px clamp(8px, 3vw, 18px); font-size: 16px; white-space: nowrap; }
			    .nav-links .divider { flex: 0 0 1px; height: 24px; }
			}
			.announcement {
			    width: 80%;               
			    max-width: 600px;        
			    margin: 30px auto 50px;   
			    padding: 20px 25px;       
			    background-color: rgba(255, 255, 255, 0.05); 
			    border: 1px solid rgba(135, 206, 235, 0.3);  
			    border-radius: 12px;       
			    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);   
			    text-align: center;       
			}
			
			.announcement-title {
			    color: skyblue;         
			    font-size: 16px;
			    font-weight: bold;
			    margin-bottom: 10px;      
			    letter-spacing: 1px;      
			}
			
			.announcement-content {
			    color: #ffffff;          
			    font-size: 18px;
			    font-family: sans-serif;
			}
			.copyright {
			    width: 100%;              
			    max-width: 100%;                  
			    margin: 60px auto 30px;
			    text-align: center;                
			    color: #ffffff;                    
			    font-size: 16px;                   
			    font-weight: bold;                 
			    font-family: sans-serif;
			    letter-spacing: 2px;               
			    text-shadow: none; 
			}
			
			.copyright::before {
			    content: '';                       
			    display: block;                    
			    width: 100%;                        
			    
			    height: 3px;                        
			    background-color: rgba(135, 206, 235, 0.8); 
			    box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
			    margin-bottom: 25px;               
			    border-radius: 2px;              
			}
			#likeBtn:hover {
			    background: rgba(135, 206, 235, 0.2);
			    box-shadow: none;
			}
			#likeBtn.clicked #heart {
			    transform: scale(1.4); 
			}
			.stats-grid {
			    display: flex;
			    justify-content: center;
			    gap: 20px;
			    margin: 30px auto;
			    width: 80%;
			    max-width: 600px;
			}
			.stat-card {
			    background: rgba(255, 255, 255, 0.05);
			    border: 1px solid rgba(135, 206, 235, 0.2);
			    border-radius: 12px;
			    padding: 15px 25px;
			    text-align: center;
			    flex: 1;
			    transition: all 0.3s ease;

			.stat-card:hover {
			    transform: translateY(-5px);
			    border-color: skyblue;
			    box-shadow: none;
			}
			.stat-num {
			    color: skyblue;
			    font-size: 22px;
			    font-weight: bold;
			    text-shadow: none;
			}
			.stat-label {
			    color: rgba(255, 255, 255, 0.5);
			    font-size: 12px;
			    margin-top: 5px;
			}
			.social-links {
			    display: flex;
			    justify-content: center;
			    gap: 15px;
			    margin-top: 15px;
			    margin-bottom: 10px;
			}
			.social-links a {
			    color: rgba(255, 255, 255, 0.7);
			    text-decoration: none;
			    font-size: 14px;
			    padding: 6px 15px;
			    border-radius: 20px;
			    background: rgba(255, 255, 255, 0.05);
			    border: 1px solid rgba(255, 255, 255, 0.1);
			    transition: all 0.3s ease;
			}
			.social-links a:hover {
			    color: #333;
			    background: skyblue;
			    box-shadow: none;
			    transform: scale(1.1);
			}
			.hitokoto-box {
			    text-align: center;
			    margin: 30px auto;
			    width: 80%;
			    max-width: 600px;
			    color: skyblue;
			    font-size: 15px;
			    font-style: italic;
			    padding: 15px;
			    border-left: 3px solid skyblue;
			    background: linear-gradient(90deg, rgba(135,206,235,0.1) 0%, transparent 100%);
			    border-radius: 0 10px 10px 0;
			}
			.guestbook {
			    width: 80%;
			    max-width: 600px;
			    margin: 40px auto;
			    background: rgba(255, 255, 255, 0.05);
			    border-radius: 15px;
			    padding: 20px;
			    border: 1px solid rgba(255, 255, 255, 0.1);
			}
			.guestbook h3 {
			    color: skyblue;
			    margin-bottom: 15px;
			    text-align: center;
			}
			.input-group {
			    display: flex;
			    gap: 10px;
			    margin-bottom: 15px;
			}
			.input-group input {
			    padding: 8px 12px;
			    border-radius: 8px;
			    border: none;
			    background: rgba(0, 0, 0, 0.2);
			    color: white;
			    outline: none;
			}
			.input-group input:focus { border-bottom: 1px solid skyblue; }
			#guestName { width: 30%; }
			#guestMsg { width: 50%; }
			#submitMsg {
			    width: 20%;
			    background: skyblue;
			    border: none;
			    border-radius: 8px;
			    cursor: pointer;
			    font-weight: bold;
			    color: #333;
			    transition: 0.3s;
			}
			#submitMsg:hover { background: white; box-shadow: none; }
			.guestbook-tools {
			    display: flex;
			    flex-wrap: wrap;
			    align-items: center;
			    gap: 8px;
			    margin-bottom: 8px;
			}
			.guestbook-tools input,
			.guestbook-tools button {
			    min-height: 34px;
			    padding: 6px 10px;
			    border: 1px solid rgba(135, 206, 235, 0.45);
			    border-radius: 8px;
			    background: rgba(0, 0, 0, 0.2);
			    color: white;
			    font: inherit;
			    font-size: 13px;
			}
			.guestbook-tools input { flex: 1 1 130px; min-width: 0; }
			.guestbook-tools input::placeholder { color: #ccc; }
			body.theme-light .guestbook-tools input::placeholder { color: #666; }
			.guestbook-tools button { color: skyblue; cursor: pointer; }
			.guestbook-tools button:hover:not(:disabled) { background: rgba(135, 206, 235, 0.15); }
			.guestbook-tools button:disabled { opacity: 0.55; cursor: default; }
			.guestbook-tools input:focus-visible,
			.guestbook-tools button:focus-visible { outline: 2px solid skyblue; outline-offset: 2px; }
			#msgStatus { color: #ddd; font-size: 12px; margin: 0 0 8px; }
			body.theme-light .guestbook-tools input,
			body.theme-light .guestbook-tools button { background: #fff; color: #333; border-color: #999; }
			body.theme-light .guestbook-tools button:hover:not(:disabled) { background: #e9f5fa; }
			body.theme-light #msgStatus { color: #555; }
			#msgList > li > span:first-child { min-width: 0; overflow-wrap: anywhere; }
			#msgList > li > span:last-child { flex-shrink: 0; }

			    justify-content: space-between;
			}

	<script>
	    function updateClock() {
	        const now = new Date();
	        const year = now.getFullYear();
	        const month = String(now.getMonth() + 1).padStart(2, '0'); 
	        const day = String(now.getDate()).padStart(2, '0');
	        const hours = String(now.getHours()).padStart(2, '0');
	        const minutes = String(now.getMinutes()).padStart(2, '0');
	        const seconds = String(now.getSeconds()).padStart(2, '0');
	        const timeString = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
	        document.getElementById('clock').textContent = timeString;
	    }
	    updateClock();
	    setInterval(updateClock, 1000);
		
		const texts = ["NB圈", "Vig 官方网站 1.0.0", "感谢你的访问！"];
		let count = 0;
		let index = 0;
		let currentText = "";
		let letter = "";
		
		(function type() {
		    if (count === texts.length) { count = 0; }
		    currentText = texts[count];
		    letter = currentText.slice(0, ++index);
		    
		    document.getElementById('typewriter').textContent = letter + "_";
		    
		    if (letter.length === currentText.length) {
		        count++;
		        index = 0;
		        setTimeout(type, 2000); 
		    } else {
		        setTimeout(type, 200);  
		    }
		})();
		function updateRuntime() {
		    const startDate = new Date(2024, 0, 1, 0, 0, 0).getTime(); 
		    const now = new Date().getTime();
		    const diff = now - startDate;
		
		    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
		    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
		    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
		    
		    document.getElementById('runtime').textContent = `本站已稳定运行：${days}天 ${hours}小时 ${minutes}分钟`;
		}
		setInterval(updateRuntime, 1000);
		updateRuntime();
		const likeBtn = document.getElementById('likeBtn');
		const heart = document.getElementById('heart');
		const likeCount = document.getElementById('likeCount');
		let currentLikes = parseInt(localStorage.getItem('vigLikes')) || 2026; 
		let hasLiked = localStorage.getItem('hasLiked');
		
		likeCount.textContent = currentLikes;
		if (hasLiked === 'true') {
		    heart.textContent = '❤️';
		    likeBtn.style.borderColor = 'rgba(255, 99, 132, 0.8)';
		    likeBtn.style.color = 'rgba(255, 99, 132, 0.8)';
		}
		
		likeBtn.addEventListener('click', () => {
		    if (hasLiked !== 'true') {
		        currentLikes++;
		        likeCount.textContent = currentLikes;
		        heart.textContent = '❤️';
		        localStorage.setItem('vigLikes', currentLikes);
		        localStorage.setItem('hasLiked', 'true');
		        likeBtn.classList.add('clicked');
		        likeBtn.style.borderColor = 'rgba(255, 99, 132, 0.8)';
		        likeBtn.style.color = 'rgba(255, 99, 132, 0.8)';
		        
		        setTimeout(() => likeBtn.classList.remove('clicked'), 200);
		    }
		});
		fetch('https://v1.hitokoto.cn/')
		    .then(response => response.json())
		    .then(data => {
		        document.getElementById('hitokoto-text').innerText = `“${data.hitokoto}”`;
		        document.getElementById('hitokoto-from').innerText = `—— 来自 ${data.from}`;
		    })
		    .catch(() => {
		        document.getElementById('hitokoto-text').innerText = '“制作不易，感谢你的访问！”';
		        document.getElementById('hitokoto-from').innerText = '—— Vig';
		    });
			const msgList = document.getElementById('msgList');
			const nameInput = document.getElementById('guestName');
			const msgInput = document.getElementById('guestMsg');
			const guestbookForm = document.getElementById('guestbookForm');
			const messageSearch = document.getElementById('messageSearch');
			const exportMsgs = document.getElementById('exportMsgs');
			const msgStatus = document.getElementById('msgStatus');

			function readMsgs() {
			    try {
			        const saved = JSON.parse(localStorage.getItem('vigMsgs') || '[]');
			        if (!Array.isArray(saved)) return [];
			        return saved.filter(item => item && typeof item.name === 'string' && typeof item.text === 'string');
			    } catch {
			        return [];
			    }
			}

			function loadMsgs() {
			    const msgs = readMsgs();
			    const query = messageSearch.value.trim().toLowerCase();
			    const matches = query
			        ? msgs.filter(m => m.name.toLowerCase().includes(query) || m.text.toLowerCase().includes(query))
			        : msgs;
			    const entries = document.createDocumentFragment();
			    matches.forEach(m => {
			        const item = document.createElement('li');
			        const content = document.createElement('span');
			        const author = document.createElement('span');
			        author.className = 'msg-name';
			        author.textContent = m.name + ':';
			        content.append(author, ' ' + m.text);
			        const time = document.createElement('span');
			        time.style.color = '#666';
			        time.style.fontSize = '12px';
			        time.textContent = typeof m.time === 'string' ? m.time : '';
			        item.append(content, time);
			        entries.append(item);
			    });
			    msgList.replaceChildren(entries);
			    exportMsgs.disabled = msgs.length === 0;
			    msgStatus.textContent = query
			        ? (matches.length ? '找到 ' + matches.length + ' 条留言，共 ' + msgs.length + ' 条。' : '没有找到匹配的留言。')
			        : '当前浏览器已保存 ' + msgs.length + ' 条留言。';
			}

			guestbookForm.addEventListener('submit', (event) => {
			    event.preventDefault();
			    const name = nameInput.value.trim() || '匿名访客';
			    const text = msgInput.value.trim();
			    if (!text) return alert('留言不能为空哦！');

			    const msgs = readMsgs();
			    const now = new Date();
			    const time = (now.getMonth() + 1) + '月' + now.getDate() + '日';
			    msgs.unshift({ name, text, time });
			    try {
			        localStorage.setItem('vigMsgs', JSON.stringify(msgs.slice(0, 20)));
			    } catch {
			        msgStatus.textContent = '留言未能保存，请检查浏览器的存储设置。';
			        return;
			    }

			    msgInput.value = '';
			    messageSearch.value = '';
			    loadMsgs();
			    msgList.scrollTop = 0;
			});

			messageSearch.addEventListener('input', loadMsgs);
			exportMsgs.addEventListener('click', () => {
			    const msgs = readMsgs();
			    if (!msgs.length) return;
			    const text = msgs.map(m => {
			        const time = typeof m.time === 'string' ? m.time : '';
			        return (time ? time + '　' : '') + m.name + '\r\n' + m.text;
			    }).join('\r\n\r\n');
			    const file = new Blob(['\uFEFFVig 访客留言\r\n\r\n', text], { type: 'text/plain;charset=utf-8' });
			    const url = URL.createObjectURL(file);
			    const link = document.createElement('a');
			    link.href = url;
			    link.download = 'Vig-访客留言.txt';
			    document.body.append(link);
			    link.click();
			    link.remove();
			    setTimeout(() => URL.revokeObjectURL(url), 1000);
			});

			loadMsgs();

			    const settingsBtn = document.getElementById('settings-btn');
			    const settingsMenu = document.getElementById('settings-menu');
			    const themeOptions = document.querySelectorAll('.theme-option');
			
			    
			    settingsBtn.addEventListener('click', (e) => {
			        e.stopPropagation(); 
			        settingsMenu.style.display = settingsMenu.style.display === 'block' ? 'none' : 'block';
			    });
			
			    
			    document.addEventListener('click', (e) => {
			        if (!document.getElementById('settings-wrapper').contains(e.target)) {
			            settingsMenu.style.display = 'none';
			        }
			    });
			
			    
			    themeOptions.forEach(opt => {
			        opt.addEventListener('click', function() {
			            const theme = this.getAttribute('data-theme');
			            
			            
			            document.body.classList.remove('theme-dark', 'theme-light');
			            
			            
			            if (theme !== 'default') {
			                document.body.classList.add('theme-' + theme);
			            }
			            
			            
			            localStorage.setItem('vigTheme', theme);
			            
			            
			            settingsMenu.style.display = 'none';
			        });
			    });
			
			    
			    const savedTheme = localStorage.getItem('vigTheme');
			    if (savedTheme && savedTheme !== 'default') {
			        document.body.classList.add('theme-' + savedTheme);
			    }
				let ua = navigator.userAgent;
				    let os = "Unknown OS";
				    if (ua.indexOf("Win") != -1) os = "Windows";
				    if (ua.indexOf("Mac") != -1) os = "macOS";
				    if (ua.indexOf("Linux") != -1) os = "Linux";
				    if (ua.indexOf("Android") != -1) os = "Android";
				    if (ua.indexOf("like Mac") != -1) os = "iOS";
				    
				    let browser = "Unknown";
				    if (ua.indexOf("Edg") != -1) browser = "Edge";
				    else if (ua.indexOf("Chrome") != -1) browser = "Chrome";
				    else if (ua.indexOf("Firefox") != -1) browser = "Firefox";
				    else if (ua.indexOf("Safari") != -1) browser = "Safari";
				
				    document.getElementById('geek-info').innerHTML = 
				        `SYS: ${os} | BROWSER: ${browser} | RES: ${window.screen.width}x${window.screen.height}`;
					document.addEventListener('contextmenu', function(e) {
					        e.preventDefault(); 
					        
					        
					        showToast('🚫 本页面已禁用右键菜单哦~');
					    });
					
					    
					    function showToast(msg) {
					        
					        let existingToast = document.getElementById('custom-toast');
					        if (existingToast) existingToast.remove();
					
					        
					        const toast = document.createElement('div');
					        toast.id = 'custom-toast';
					        toast.textContent = msg;
					        
					        
					        toast.style.cssText = `
					            position: fixed;
					            bottom: 40px;
					            left: 50%;
					            transform: translateX(-50%);
					            background: rgba(0, 0, 0, 0.85);
					            color: skyblue;
					            padding: 12px 24px;
					            border-radius: 30px;
					            border: 1px solid rgba(135, 206, 235, 0.6);
					            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
					            z-index: 999999;
					            font-size: 14px;
					            font-weight: bold;
					            font-family: sans-serif;
					            pointer-events: none; 
					            opacity: 0;
					            animation: toastFade 2s forwards;
					        `;
					        
					        document.body.appendChild(toast);
					
					        
					        setTimeout(() => {
					            if (toast) toast.remove();
					        }, 2000);
					    }
						document.addEventListener('keydown', function(e) {
						    
						    if (e.key === 'F12' || e.keyCode === 123) {
						        e.preventDefault();
						        
						        showToast('🚫 开发者工具已被禁用');
						    }
						    
						    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) {
						        e.preventDefault();
						    }
						    
						    if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
						        e.preventDefault();
						    }
						});
						document.addEventListener('keydown', function(e) {
						    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
						        e.preventDefault();
						        
						    }
						});
