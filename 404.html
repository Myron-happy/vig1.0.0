<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面去哪了？ | Vioz 官方网站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #464646;
            font-family: sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .error-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            color: skyblue;
            text-shadow: none;
            line-height: 1;
            letter-spacing: 5px;
            animation: float 3s ease-in-out infinite;
        }
        .error-icon {
            font-size: 60px;
            margin: 20px 0;
        }
        .error-title {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .error-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.8;
            margin-bottom: 40px;
        }
        .back-btn {
            display: inline-block;
            color: skyblue;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 35px;
            border: 1px solid rgba(135, 206, 235, 0.5);
            border-radius: 30px;
            background: rgba(135, 206, 235, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .back-btn:hover {
            background: skyblue;
            color: #333;
            box-shadow: none;
            transform: translateY(-3px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        
        body.theme-dark { background: #121212 !important; }
        body.theme-light { background: #f5f5f5 !important; color: #333 !important; }

        body.theme-light .error-code { color: #009dff; text-shadow: none; }
        body.theme-light .error-title { color: #333; }
        body.theme-light .error-desc { color: #666; }
        body.theme-light .back-btn { color: #009dff; border-color: #009dff; background: rgba(0, 157, 255, 0.05); }
        body.theme-light .back-btn:hover { background: #009dff; color: #fff; }

        body.theme-dark .error-code { text-shadow: none; }

        
        #settings-wrapper { position: fixed; bottom: 30px; right: 30px; z-index: 9999; font-family: sans-serif; }
        #settings-btn { width: 50px; height: 50px; border-radius: 50%; background: #333; color: white; border: 2px solid skyblue; cursor: pointer; font-size: 24px; display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); }
        #settings-btn:hover { background: skyblue; color: #333; transform: rotate(90deg) scale(1.1); }
        #settings-menu { display: none; position: absolute; bottom: 65px; right: 0; background: #2a2a2a; padding: 15px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0, 0, 0, 0.8); border: 1px solid skyblue; width: 140px; }
        #settings-menu h4 { margin: 0 0 10px 0; color: white; font-size: 14px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 8px; }
        .theme-option { display: block; width: 100%; padding: 10px; margin-bottom: 5px; background: transparent; color: white; border: 1px solid transparent; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; text-align: left; }
        .theme-option:hover { background: rgba(135, 206, 235, 0.2); color: skyblue; padding-left: 15px; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-icon">🛸</div>
        <h1 class="error-title">页面神秘失踪了</h1>
        <p class="error-desc">
            您访问的页面似乎被外星人带走了，或者它从未存在过。<br>
            请检查网址是否拼写正确，或者返回首页重新探索。
        </p>
        <a href="index.html" class="back-btn">← 返回首页</a>
    </div>

    
    <div id="settings-wrapper">
        <button id="settings-btn" title="设置">⚙️</button>
        <div id="settings-menu">
            <h4>🎨 页面风格</h4>
            <button class="theme-option" data-theme="default">🔄 默认</button>
            <button class="theme-option" data-theme="dark">🌑 纯黑</button>
            <button class="theme-option" data-theme="light">☀️ 纯白</button>
        </div>
    </div>

    <script>
        
        const savedTheme = localStorage.getItem('vigTheme');
        if (savedTheme && savedTheme !== 'default') {
            document.body.classList.add('theme-' + savedTheme);
        }

        
        const settingsBtn = document.getElementById('settings-btn');
        const settingsMenu = document.getElementById('settings-menu');
        const themeOptions = document.querySelectorAll('.theme-option');

        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsMenu.style.display = settingsMenu.style.display === 'block' ? 'none' : 'block';
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('settings-wrapper').contains(e.target)) {
                settingsMenu.style.display = 'none';
            }
        });

        themeOptions.forEach(opt => {
            opt.addEventListener('click', function() {
                const theme = this.getAttribute('data-theme');
                document.body.classList.remove('theme-dark', 'theme-light');
                if (theme !== 'default') {
                    document.body.classList.add('theme-' + theme);
                }
                localStorage.setItem('vigTheme', theme);
                settingsMenu.style.display = 'none';
            });
        });
    </script>
</body>
</html>
