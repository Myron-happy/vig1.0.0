<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vioz - 天气预报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #464646;
            font-family: sans-serif;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }
        .weather-header { text-align: center; margin-bottom: 30px; width: 100%; }
        .weather-header h1 {
            color: skyblue;
            font-size: 28px;
            font-weight: bold;
            text-shadow: none;
            letter-spacing: 2px;
        }
        
        .location-status {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 15px;
            min-height: 24px;
            line-height: 1.5;
            padding: 0 10px;
        }
        
        .error-box {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 10px 20px;
            border-radius: 8px;
            margin: 10px auto;
            max-width: 600px;
            font-size: 14px;
            display: none;
            animation: shake 0.5s ease;
        }

        .manual-box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            animation: fadeIn 0.5s ease;
        }
        .city-select {
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 20px;
            background: #333;
            color: white;
            border: 1px solid rgba(135, 206, 235, 0.5);
            outline: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .city-select:hover { border-color: skyblue; box-shadow: none; }
        .city-select:focus-visible { outline: 2px solid skyblue; outline-offset: 2px; }
        .city-select option { background: #333; color: #fff; }
        .weather-refresh:disabled { opacity: 0.65; cursor: default; }
        
        .update-time { color: rgba(255, 255, 255, 0.4); font-size: 13px; margin-top: 10px; }
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 40px;
        }
        .weather-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(135, 206, 235, 0.25);
            border-radius: 16px;
            padding: 20px 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        .weather-card:hover {
            transform: translateY(-5px);
            border-color: rgba(135, 206, 235, 0.6);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        }
        .weather-card.today {
            border-color: skyblue;
            background: rgba(135, 206, 235, 0.12);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .card-date { font-size: 14px; color: rgba(255, 255, 255, 0.7); margin-bottom: 8px; }
        .card-weekday { font-size: 12px; color: rgba(255, 255, 255, 0.4); margin-bottom: 12px; }
        .card-icon { font-size: 40px; margin-bottom: 10px; line-height: 1; }
        .card-desc { font-size: 14px; color: skyblue; margin-bottom: 12px; font-weight: bold; }
        .card-temp { font-size: 20px; font-weight: bold; color: #ffffff; margin-bottom: 4px; }
        .card-temp-max { color: #ff9f43; }
        .card-temp-min { color: rgba(135, 206, 235, 0.8); font-size: 16px; }
        .card-extra { font-size: 12px; color: rgba(255, 255, 255, 0.4); margin-top: 10px; line-height: 1.6; }
        
        .loading { text-align: center; color: rgba(255, 255, 255, 0.5); font-size: 18px; padding: 60px 0; }
        .back-link { margin-top: 30px; margin-bottom: 30px; }
        .back-link a {
            color: skyblue; text-decoration: none; font-size: 16px;
            padding: 10px 24px; border: 1px solid rgba(135, 206, 235, 0.4);
            border-radius: 25px; transition: all 0.3s ease; display: inline-block;
        }
        .back-link a:hover { background: rgba(135, 206, 235, 0.15); box-shadow: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        
        body.theme-dark { background: #121212 !important; }
        body.theme-light { background: #f5f5f5 !important; color: #333 !important; }
        body.theme-light .weather-header h1 { color: #009dff; text-shadow: none; }
        body.theme-light .location-status { color: #666; }
        body.theme-light .weather-card { background: rgba(0,0,0,0.03); border-color: #ddd; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        body.theme-light .weather-card.today { border-color: #009dff; background: rgba(0,157,255,0.1); }
        body.theme-light .card-date { color: #333; }
        body.theme-light .card-weekday { color: #888; }
        body.theme-light .card-desc { color: #009dff; }
        body.theme-light .card-temp { color: #333; }
        body.theme-light .card-temp-max { color: #e67e22; }
        body.theme-light .back-link a { color: #009dff; border-color: #009dff; }
        body.theme-light .city-select { background: #fff; color: #333; border-color: #ccc; }
        body.theme-light .error-box { background: rgba(211, 47, 47, 0.1); border-color: #d32f2f; color: #d32f2f; }
        body.theme-light #settings-menu { background: #fff; border-color: #009dff; }
        body.theme-light #settings-menu h4 { color: #333; border-bottom-color: #ddd; }
        body.theme-light .theme-option { color: #333; }
        body.theme-light .theme-option:hover { background: rgba(0, 157, 255, 0.1); }

        
        #settings-wrapper { position: fixed; bottom: 30px; right: 30px; z-index: 9999; font-family: sans-serif; }
        #settings-btn { width: 50px; height: 50px; border-radius: 50%; background: #333; color: white; border: 2px solid skyblue; cursor: pointer; font-size: 24px; display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); }
        #settings-btn:hover { background: skyblue; color: #333; transform: rotate(90deg) scale(1.1); }
        #settings-menu { display: none; position: absolute; bottom: 65px; right: 0; background: #2a2a2a; padding: 15px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0, 0, 0, 0.8); border: 1px solid skyblue; width: 140px; }
        #settings-menu h4 { margin: 0 0 10px 0; color: white; font-size: 14px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 8px; }
        .theme-option { display: block; width: 100%; padding: 10px; margin-bottom: 5px; background: transparent; color: white; border: 1px solid transparent; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; text-align: left; }
        .theme-option:hover { background: rgba(135, 206, 235, 0.2); color: skyblue; padding-left: 15px; }
    </style>
</head>
<body>

    <div class="weather-header">
        <h1>🌤 未来一周天气</h1>
        
        <div id="errorBox" class="error-box"></div>
        <div id="statusMsg" class="location-status"><span id="locationText">正在请求定位...</span><span id="weatherActivity" role="status"></span></div>
        
        <div id="manualBox" class="manual-box">
            <select id="citySelect" class="city-select" aria-label="天气城市">
                <option value="" disabled selected>⚠️ 请手动选择城市</option>
                <option value="auto">📍 自动定位</option>
                <option value="39.9042,116.4074">北京</option>
                <option value="31.2304,121.4737">上海</option>
                <option value="23.1291,113.2644">广州</option>
                <option value="22.5431,114.0579">深圳</option>
                <option value="30.2741,120.1551">杭州</option>
                <option value="30.5728,104.0668">成都</option>
                <option value="30.5928,114.3055">武汉</option>
                <option value="34.3416,108.9398">西安</option>
                <option value="32.0603,118.7969">南京</option>
                <option value="29.5630,106.5516">重庆</option>
            </select>
            <button id="refreshWeather" class="city-select weather-refresh" type="button" disabled>刷新天气</button>
            <select id="temperatureUnit" class="city-select" aria-label="温度单位">
                <option value="celsius">℃</option>
                <option value="fahrenheit">℉</option>
            </select>
        </div>
        <div class="update-time" id="updateTime"></div>
    </div>

    <div class="weather-grid" id="weatherGrid">
        <div class="loading" style="grid-column: 1 / -1;">正在获取天气数据...</div>
    </div>

    <div class="back-link">
        <a href="index.html">← 返回首页</a>
    </div>

    <div id="settings-wrapper">
        <button id="settings-btn" title="设置">⚙️</button>
        <div id="settings-menu">
            <h4>🎨 页面风格</h4>
            <button class="theme-option" data-theme="default">🔄 默认</button>
            <button class="theme-option" data-theme="dark">🌑 纯黑</button>
            <button class="theme-option" data-theme="light">☀️ 纯白</button>
        </div>
    </div>

<script>
(function() {
    'use strict';

    const WEATHER_REFRESH_INTERVAL = 10 * 60 * 1000; 
    const NETWORK_CHECK_INTERVAL = 30 * 1000;        
    const citySelect = document.getElementById('citySelect');
    const temperatureSelect = document.getElementById('temperatureUnit');
    const refreshButton = document.getElementById('refreshWeather');
    const locationText = document.getElementById('locationText');
    const weatherActivity = document.getElementById('weatherActivity');
    
    let currentLat = null;
    let currentLon = null;
    let weatherTimer = null;
    let networkTimer = null;
    let isVpnDetected = false;
    let isLocating = false;
    let isManualCity = false;
    let locationVersion = 0;
    let weatherController = null;
    let weatherData = null;

    const WEATHER_CODES = {
        0: { desc: '晴', icon: '☀️' }, 1: { desc: '大部晴朗', icon: '🌤️' },
        2: { desc: '局部多云', icon: '⛅' }, 3: { desc: '阴', icon: '☁️' },
        45: { desc: '雾', icon: '🌫️' }, 48: { desc: '雾凇', icon: '🌫️' },
        51: { desc: '小毛毛雨', icon: '🌦️' }, 53: { desc: '毛毛雨', icon: '🌦️' },
        55: { desc: '大毛毛雨', icon: '🌧️' }, 56: { desc: '冻毛毛雨', icon: '🌧️' },
        57: { desc: '强冻毛毛雨', icon: '🌧️' }, 61: { desc: '小雨', icon: '🌧️' },
        63: { desc: '中雨', icon: '🌧️' }, 65: { desc: '大雨', icon: '🌧️' },
        66: { desc: '冻雨', icon: '🌧️' }, 67: { desc: '强冻雨', icon: '🌧️' },
        71: { desc: '小雪', icon: '🌨️' }, 73: { desc: '中雪', icon: '🌨️' },
        75: { desc: '大雪', icon: '❄️' }, 77: { desc: '雪粒', icon: '❄️' },
        80: { desc: '小阵雨', icon: '🌦️' }, 81: { desc: '中阵雨', icon: '🌧️' },
        82: { desc: '大阵雨', icon: '⛈️' }, 85: { desc: '小阵雪', icon: '🌨️' },
        86: { desc: '大阵雪', icon: '❄️' }, 95: { desc: '雷暴', icon: '⛈️' },
        96: { desc: '雷暴伴冰雹', icon: '⛈️' }, 99: { desc: '雷暴大冰雹', icon: '⛈️' }
    };
    const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    function getWeatherInfo(code) { return WEATHER_CODES[code] || { desc: '未知', icon: '❓' }; }
    function formatDate(dateStr) { const d = new Date(dateStr); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
    function getWeekday(dateStr) { const d = new Date(dateStr); return WEEKDAYS[d.getDay()]; }
    function getTodayStr() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function formatUpdateTime() {
        const d = new Date();
        return '最后更新：' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
    }

    function formatTemperature(value) {
        if (!Number.isFinite(value)) return '—';
        if (temperatureSelect.value === 'fahrenheit') return Math.round(value * 9 / 5 + 32) + '℉';
        return Math.round(value) + '℃';
    }

    function renderWeather(data) {
        const daily = data.daily;
        const grid = document.getElementById('weatherGrid');
        const todayStr = getTodayStr();
        let html = '';

        for (let i = 0; i < daily.time.length; i++) {
            const dateStr = daily.time[i];
            const code = daily.weather_code[i];
            const tempMax = formatTemperature(daily.temperature_2m_max[i]);
            const tempMin = formatTemperature(daily.temperature_2m_min[i]);
            const precip = daily.precipitation_sum ? daily.precipitation_sum[i] : 0;
            const windMax = daily.wind_speed_10m_max ? Math.round(daily.wind_speed_10m_max[i]) : '--';
            const info = getWeatherInfo(code);
            const isToday = (dateStr === todayStr);

            html += `<div class="weather-card ${isToday ? 'today' : ''}">
                <div class="card-date">${formatDate(dateStr)}</div>
                <div class="card-weekday">${isToday ? '今天' : getWeekday(dateStr)}</div>
                <div class="card-icon">${info.icon}</div>
                <div class="card-desc">${info.desc}</div>
                <div class="card-temp"><span class="card-temp-max">${tempMax}</span><span class="card-temp-min"> / ${tempMin}</span></div>
                <div class="card-extra">💧 ${precip}mm<br>💨 ${windMax}km/h</div>
            </div>`;
        }
        grid.innerHTML = html;
    }

    function updateRefreshButton() {
        refreshButton.disabled = !currentLat || !currentLon || isVpnDetected || weatherController !== null;
    }

    async function fetchWeather(activity = ' | 正在获取天气...') {
        if (!currentLat || !currentLon || isVpnDetected || weatherController) return;

        const controller = new AbortController();
        weatherController = controller;
        updateRefreshButton();
        weatherActivity.textContent = activity;
        const timeout = setTimeout(() => controller.abort(), 12000);
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=auto&forecast_days=7`;

        try {
            const response = await fetch(url, { signal: controller.signal });
            const data = await response.json();
            if (weatherController !== controller) return;
            if (!response.ok || data.error || !data.daily?.time?.length) {
                throw new Error(data.reason || '天气数据不可用');
            }
            renderWeather(data);
            weatherData = data;
            weatherActivity.textContent = '';
            document.getElementById('updateTime').textContent = formatUpdateTime();
        } catch (err) {
            if (weatherController !== controller) return;
            console.error('天气获取失败:', err);
            weatherActivity.textContent = weatherData ? ' | 刷新失败，请检查网络' : '';
            if (!weatherData) {
                document.getElementById('weatherGrid').innerHTML = '<div class="loading" style="grid-column: 1 / -1; color: #ff6b6b;">天气数据加载失败，请检查网络。</div>';
            }
        } finally {
            clearTimeout(timeout);
            if (weatherController === controller) {
                weatherController = null;
                updateRefreshButton();
            }
        }
    }

    function startWeatherRefresh() {
        stopWeatherRefresh();
        weatherTimer = setInterval(() => fetchWeather(), WEATHER_REFRESH_INTERVAL);
    }

    function stopWeatherRefresh() {
        clearInterval(weatherTimer);
        weatherTimer = null;
    }

    function resetLocation() {
        locationVersion++;
        isLocating = false;
        currentLat = null;
        currentLon = null;
        weatherData = null;
        const previousController = weatherController;
        weatherController = null;
        if (previousController) previousController.abort();
        stopWeatherRefresh();
        weatherActivity.textContent = '';
        document.getElementById('updateTime').textContent = '';
        updateRefreshButton();
    }

    function showLocError(msg, isVpn = false) {
        resetLocation();
        isVpnDetected = isVpn;
        citySelect.value = '';
        document.getElementById('errorBox').style.display = 'block';
        document.getElementById('errorBox').textContent = `⚠️ ${msg}`;
        document.getElementById('statusMsg').style.display = 'none';
        document.getElementById('weatherGrid').innerHTML = '<div class="loading" style="grid-column: 1 / -1;">请在上方手动选择城市以继续查看天气</div>';
    }

    function clearError() {
        document.getElementById('errorBox').style.display = 'none';
        document.getElementById('statusMsg').style.display = 'block';
        isVpnDetected = false;
        document.getElementById('weatherGrid').innerHTML = '<div class="loading" style="grid-column: 1 / -1;">正在获取天气数据...</div>';
    }

    function saveWeatherPreference(key, value) {
        try {
            if (value === null) localStorage.removeItem(key);
            else localStorage.setItem(key, value);
        } catch {}
    }

    function useManualCity() {
        const option = citySelect.selectedOptions[0];
        if (!option || option.disabled || !option.value || option.value === 'auto') return;

        resetLocation();
        clearError();
        isManualCity = true;
        [currentLat, currentLon] = option.value.split(',');
        saveWeatherPreference('vigWeatherCity', option.value);
        locationText.textContent = `📍 已手动选择城市（${option.textContent}）`;
        fetchWeather();
        startWeatherRefresh();
    }

    function useAutomaticLocation() {
        resetLocation();
        clearError();
        isManualCity = false;
        citySelect.value = 'auto';
        saveWeatherPreference('vigWeatherCity', null);
        locationText.textContent = '正在请求定位...';
        getGPSLocation();
    }

    
    function getGPSLocation() {
        if (isManualCity || isVpnDetected || isLocating) return;
        isLocating = true;
        const version = locationVersion;

        if (!navigator.geolocation) {
            showLocError('浏览器不支持定位，请手动选择城市。');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(pos) {
                if (version !== locationVersion) return;
                const lat = pos.coords.latitude.toFixed(4);
                const lon = pos.coords.longitude.toFixed(4);
                locationText.textContent = '定位成功，正在校验城市信息...';

                fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`)
                    .then(res => res.json())
                    .then(data => {
                        if (version !== locationVersion) return;
                        if (data.countryCode !== 'CN') {
                            showLocError(`检测到当前位置不在国内（当前：${data.countryName || '海外'}），请关闭 VPN 或手动选择城市。`, true);
                            return;
                        }

                        currentLat = lat;
                        currentLon = lon;
                        const cityName = document.createElement('b');
                        cityName.textContent = data.city || data.locality || '当前位置';
                        locationText.replaceChildren('📍 已定位：', cityName);
                        isLocating = false;
                        fetchWeather();
                        startWeatherRefresh();
                    })
                    .catch(() => {
                        if (version !== locationVersion) return;
                        currentLat = lat;
                        currentLon = lon;
                        locationText.textContent = '📍 定位成功';
                        isLocating = false;
                        fetchWeather('，正在获取天气...');
                        startWeatherRefresh();
                    });
            },
            function(err) {
                if (version !== locationVersion) return;
                let msg = '定位失败：';
                if(err.code === 1) msg += '您拒绝了授权。';
                else if(err.code === 2) msg += '无法获取位置。';
                else if(err.code === 3) msg += '定位超时。';
                showLocError(msg + ' 请手动选择城市。');
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
    }

    
    function checkNetworkStatus() {
        if (isManualCity || isVpnDetected || isLocating || !currentLat || !currentLon || !navigator.geolocation) return;
        const version = locationVersion;
        
        navigator.geolocation.getCurrentPosition(function(pos) {
            if (version !== locationVersion) return;
            let lat = pos.coords.latitude.toFixed(4);
            let lon = pos.coords.longitude.toFixed(4);
            
            
            fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`)
                .then(res => res.json())
                .then(data => {
                    if (version !== locationVersion) return;
                    if (data.countryCode !== 'CN') {
                        showLocError(`检测到您开启了海外网络/VPN 或代理（当前GPS：${data.countryName || '海外'}），请关闭或手动选择城市。`, true);
                    }
                }).catch(() => {});
        }, function(err) {
            
        }, { enableHighAccuracy: true, timeout: 3000, maximumAge: 0 });
    }

    function init() {
        const savedTheme = localStorage.getItem('vigTheme');
        if (savedTheme && savedTheme !== 'default') {
            document.body.classList.add('theme-' + savedTheme);
        }
        
        const settingsBtn = document.getElementById('settings-btn');
        const settingsMenu = document.getElementById('settings-menu');
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsMenu.style.display = settingsMenu.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', () => settingsMenu.style.display = 'none');
        document.querySelectorAll('.theme-option').forEach(opt => {
            opt.addEventListener('click', function() {
                const theme = this.getAttribute('data-theme');
                document.body.classList.remove('theme-dark', 'theme-light');
                if (theme !== 'default') document.body.classList.add('theme-' + theme);
                localStorage.setItem('vigTheme', theme);
                settingsMenu.style.display = 'none';
            });
        });

        citySelect.addEventListener('change', () => {
            if (citySelect.value === 'auto') useAutomaticLocation();
            else useManualCity();
        });
        refreshButton.addEventListener('click', () => fetchWeather());
        temperatureSelect.value = localStorage.getItem('vigWeatherTemperatureUnit') === 'fahrenheit' ? 'fahrenheit' : 'celsius';
        temperatureSelect.addEventListener('change', () => {
            saveWeatherPreference('vigWeatherTemperatureUnit', temperatureSelect.value);
            if (weatherData) renderWeather(weatherData);
        });

        citySelect.value = localStorage.getItem('vigWeatherCity') || '';
        if (citySelect.value && citySelect.value !== 'auto') useManualCity();
        else useAutomaticLocation();

        
        if (networkTimer) clearInterval(networkTimer);
        networkTimer = setInterval(checkNetworkStatus, NETWORK_CHECK_INTERVAL);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
document.addEventListener('contextmenu', function(e) {
        e.preventDefault(); 
        
        
        showToast('🚫 本页面已禁用右键菜单哦~');
    });

    
    function showToast(msg) {
        
        let existingToast = document.getElementById('custom-toast');
        if (existingToast) existingToast.remove();

        
        const toast = document.createElement('div');
        toast.id = 'custom-toast';
        toast.textContent = msg;
        
        
        toast.style.cssText = `
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: skyblue;
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(135, 206, 235, 0.6);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
            z-index: 999999;
            font-size: 14px;
            font-weight: bold;
            font-family: sans-serif;
            pointer-events: none; 
            opacity: 0;
            animation: toastFade 2s forwards;
        `;
        
        document.body.appendChild(toast);

        
        setTimeout(() => {
            if (toast) toast.remove();
        }, 2000);
    }
	document.addEventListener('keydown', function(e) {
	    
	    if (e.key === 'F12' || e.keyCode === 123) {
	        e.preventDefault();
	        
	        showToast('🚫 开发者工具已被禁用');
	    }
	    
	    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) {
	        e.preventDefault();
	    }
	    
	    if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
	        e.preventDefault();
	    }
	});
	document.addEventListener('keydown', function(e) {
	    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
	        e.preventDefault();
	        
	    }
	});

</script>
